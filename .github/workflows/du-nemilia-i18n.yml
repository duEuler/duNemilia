name: duNemilia regression (EN/PT-BR + WebMCP lab)
on:
  push:
    branches: ['feat/**', 'test/**']
  pull_request:
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: node --check i18n/runtime.js
      - name: Behavioral localization + simulated WebMCP lab
        run: node --test tests/*.test.cjs
      - name: Build reversible localized HTML
        run: python tools/build_i18n.py --input Nemilia-v2_2.html --output dist/Nemilia-v2_2-i18n-pilot.html
      - name: Verify original untouched
        shell: python
        run: |
          from pathlib import Path
          original=Path('Nemilia-v2_2.html').read_bytes()
          output=Path('dist/Nemilia-v2_2-i18n-pilot.html').read_bytes()
          assert b'<!-- duNemilia-i18n-pilot:1 -->' not in original
          assert output.count(b'<!-- duNemilia-i18n-pilot:1 -->')==1
