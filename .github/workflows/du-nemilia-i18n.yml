name: duNemilia i18n pilot tests
on:
  push:
    branches: ['feat/**']
  pull_request:
jobs:
  pilot:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Runtime syntax
        run: node --check i18n/runtime.js
      - name: Behavioral i18n tests
        run: node --test tests/i18n-runtime.test.cjs
      - name: Offline single-file pilot build
        run: python tools/build_i18n.py --input Nemilia-v2_2.html --output dist/Nemilia-v2_2-i18n-pilot.html
      - name: Verify original integrity
        shell: python
        run: |
          from pathlib import Path
          assert Path('Nemilia-v2_2.html').is_file()
          assert Path('dist/Nemilia-v2_2-i18n-pilot.html').is_file()
          assert '<!-- duNemilia-i18n-pilot:1 -->' not in Path('Nemilia-v2_2.html').read_text(encoding='utf-8')
