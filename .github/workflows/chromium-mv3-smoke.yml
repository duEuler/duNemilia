name: Chromium MV3 extension smoke
on:
  workflow_dispatch:
  push:
    branches: ['test/**']
    paths: ['tests/extension_smoke.py','.github/workflows/chromium-mv3-smoke.yml']
  pull_request:
    paths: ['tests/extension_smoke.py','.github/workflows/chromium-mv3-smoke.yml']
permissions:
  contents: read
jobs:
  mv3-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Playwright Chromium
        run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
      - name: Launch real MV3 extension (public baseline 2.2)
        run: |
          python tests/extension_smoke.py --zip nemilia-extension.zip --output artifacts/extension-smoke.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mv3-extension-smoke
          path: artifacts/
          if-no-files-found: warn
